<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WearOS Gyökkalkulátor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* WearOS kör-kijelző konténer szimuláció */
        .wear-screen {
            width: 100vw;
            height: 100vh;
            max-width: 454px;
            max-height: 454px;
            margin: 0 auto;
            position: relative;
            background: #000000;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.95);
        }

        /* Testreszabott görgetősáv elrejtése */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Watch gombok érintési animációja */
        .watch-btn {
            transition: transform 0.08s ease, filter 0.08s ease;
        }
        .watch-btn:active {
            transform: scale(0.92);
            filter: brightness(1.35);
        }

        /* Kör alakú kijelző biztonságos belső margói */
        .circle-safe {
            padding-left: 11%;
            padding-right: 11%;
        }
    </style>
</head>
<body class="flex items-center justify-center bg-black">

<!-- Fő WearOS Képernyő -->
<div class="wear-screen flex flex-col justify-between py-2 select-none relative">
    
    <!-- Felső sáv: Idő & Gyors Sablonválasztó -->
    <header class="pt-1.5 z-20 flex flex-col items-center w-full">
        <div class="text-[10px] font-bold tracking-wider text-cyan-400 mb-1 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="current-time">12:00</span>
            <span class="text-zinc-600">|</span>
            <span id="header-mode-title" class="text-zinc-300">SZABAD BEVITEL</span>
        </div>

        <!-- Módválasztó görgethető csempék -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-[82%] px-2 py-0.5">
            <button id="tab-free" onclick="switchMode('free')" class="watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-cyan-600 text-white shadow whitespace-nowrap">
                Szabad (√a±√b)
            </button>
            <button id="tab-identity" onclick="switchMode('identity')" class="watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">
                (√a ± √b)²
            </button>
            <button id="tab-extract" onclick="switchMode('extract')" class="watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">
                Kiemelés (√x)
            </button>
            <button id="tab-insert" onclick="switchMode('insert')" class="watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">
                Bevilágítás (a√b)
            </button>
            <button id="tab-div" onclick="switchMode('div')" class="watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">
                Osztás (√a / √b)
            </button>
        </div>
    </header>

    <!-- 1. FŐ NÉZET: SZABAD ÉS ÁLTALÁNOS KALKULÁTOR -->
    <main id="view-free" class="flex-1 flex flex-col justify-center items-center w-full px-2 z-10 overflow-hidden">
        
        <!-- Kifejezés kijelző kártya -->
        <div class="w-full max-w-[285px] bg-zinc-950/90 border border-zinc-800 rounded-2xl p-2 px-3 mb-1.5 flex flex-col justify-center items-end text-right min-h-[50px]">
            <div id="preview-text" class="text-[10px] text-zinc-500 mono h-3.5 overflow-hidden truncate w-full text-left">
                Pl: √2 + √50 - √18 vagy (√5 + √7)²
            </div>
            <div id="math-display" class="text-lg font-extrabold text-cyan-300 mono tracking-wide flex items-center justify-end w-full overflow-x-auto no-scrollbar whitespace-nowrap">
                <span class="text-zinc-600">0</span>
            </div>
        </div>

        <!-- 4 oszlopos kompakt órabillentyűzet kifejezetten gyökös műveletekhez -->
        <div class="w-full max-w-[295px] grid grid-cols-4 gap-1 px-1">
            <!-- 1. sor -->
            <button onclick="inputKey('AC')" class="watch-btn h-8 rounded-xl bg-rose-950/80 border border-rose-800/60 text-rose-300 font-bold text-xs">AC</button>
            <button onclick="inputKey('√')" class="watch-btn h-8 rounded-xl bg-cyan-950 border border-cyan-500/60 text-cyan-300 font-black text-sm">√</button>
            <button onclick="inputKey('²')" class="watch-btn h-8 rounded-xl bg-cyan-950 border border-cyan-500/60 text-cyan-300 font-black text-sm">x²</button>
            <button onclick="inputKey('/')" class="watch-btn h-8 rounded-xl bg-zinc-850 text-emerald-400 font-bold text-sm">÷</button>

            <!-- 2. sor -->
            <button onclick="inputKey('(')" class="watch-btn h-8 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 font-bold text-xs">(</button>
            <button onclick="inputKey(')')" class="watch-btn h-8 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 font-bold text-xs">)</button>
            <button onclick="inputKey('*')" class="watch-btn h-8 rounded-xl bg-zinc-850 text-emerald-400 font-bold text-sm">×</button>
            <button onclick="inputKey('-')" class="watch-btn h-8 rounded-xl bg-zinc-850 text-emerald-400 font-bold text-base">−</button>

            <!-- 3. sor -->
            <button onclick="inputKey('7')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">7</button>
            <button onclick="inputKey('8')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">8</button>
            <button onclick="inputKey('9')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">9</button>
            <button onclick="inputKey('+')" class="watch-btn h-8 rounded-xl bg-zinc-850 text-emerald-400 font-bold text-sm">+</button>

            <!-- 4. sor -->
            <button onclick="inputKey('4')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">4</button>
            <button onclick="inputKey('5')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">5</button>
            <button onclick="inputKey('6')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">6</button>
            <button onclick="inputKey('DEL')" class="watch-btn h-8 rounded-xl bg-zinc-800 text-amber-400 font-bold text-xs">⌫</button>

            <!-- 5. sor -->
            <button onclick="inputKey('1')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">1</button>
            <button onclick="inputKey('2')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">2</button>
            <button onclick="inputKey('3')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">3</button>
            <button onclick="inputKey('0')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">0</button>
        </div>

        <!-- Megoldás Gomb -->
        <div class="w-full max-w-[295px] mt-1 px-1">
            <button onclick="computeFreeExpression()" class="watch-btn w-full h-8 rounded-xl bg-gradient-to-r from-cyan-600 via-teal-500 to-emerald-500 text-white font-black text-xs tracking-wider flex items-center justify-center shadow-lg">
                LEVEZETÉS ÉS MEGOLDÁS (=)
            </button>
        </div>
    </main>

    <!-- 2. NÉZET: SABLONOK (NEVEZETES AZONOSSÁGOK, OSZTÁS, STB.) -->
    <main id="view-template" class="hidden flex-1 flex flex-col justify-center items-center w-full circle-safe z-10 overflow-hidden">
        <div id="template-card" class="w-full bg-zinc-950 border border-cyan-500/40 rounded-2xl p-2.5 flex flex-col items-center mb-2">
            <!-- Dinamikus sablon űrlap -->
        </div>

        <!-- Számbeviteli billentyűzet a sablonhoz -->
        <div class="w-full max-w-[260px] grid grid-cols-3 gap-1 mb-1">
            <button onclick="tplInput('1')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">1</button>
            <button onclick="tplInput('2')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">2</button>
            <button onclick="tplInput('3')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">3</button>
            <button onclick="tplInput('4')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">4</button>
            <button onclick="tplInput('5')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">5</button>
            <button onclick="tplInput('6')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">6</button>
            <button onclick="tplInput('7')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">7</button>
            <button onclick="tplInput('8')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">8</button>
            <button onclick="tplInput('9')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">9</button>
            <button onclick="tplInput('DEL')" class="watch-btn h-8 rounded-xl bg-zinc-800 text-amber-400 font-bold text-xs">⌫</button>
            <button onclick="tplInput('0')" class="watch-btn h-8 rounded-xl bg-zinc-900 text-white font-bold text-sm">0</button>
            <button onclick="computeTemplate()" class="watch-btn h-8 rounded-xl bg-cyan-600 text-white font-black text-xs">OK</button>
        </div>
    </main>

    <!-- 3. NÉZET: EREDMÉNY ÉS LÉPÉSRŐL-LÉPÉSRE LEVEZETÉS -->
    <main id="view-result" class="hidden flex-1 w-full overflow-y-auto no-scrollbar circle-safe py-1 flex flex-col items-center">
        <!-- Vissza gomb -->
        <div class="w-full flex items-center justify-between border-b border-zinc-800 pb-1 mb-1.5 sticky top-0 bg-black/90 backdrop-blur z-20">
            <span class="text-[9px] font-bold text-cyan-400 uppercase tracking-widest">Levezetés a füzet szerint</span>
            <button onclick="closeResult()" class="watch-btn text-[10px] bg-zinc-850 hover:bg-zinc-800 text-zinc-200 px-2.5 py-0.5 rounded-full border border-zinc-700">
                ✕ Vissza
            </button>
        </div>

        <!-- Végeredmény kiemelt kártya -->
        <div class="w-full bg-gradient-to-b from-cyan-950/60 to-zinc-900 border border-cyan-500/50 rounded-2xl p-2.5 text-center mb-2 shadow-lg">
            <div class="text-[9px] text-zinc-400 uppercase tracking-wider">Végeredmény</div>
            <div id="res-exact" class="text-xl font-extrabold text-cyan-300 mono my-0.5 break-words"></div>
            <div id="res-approx" class="text-[10px] text-emerald-400 mono"></div>
        </div>

        <!-- Füzet-stílusú lépések listája -->
        <div id="res-steps" class="w-full flex flex-col gap-1.5 pb-12">
            <!-- Dinamikus lépések -->
        </div>
    </main>

    <!-- Alsó dekoratív sáv / WearOS swipe jelzés -->
    <footer class="pb-0.5 text-center pointer-events-none">
        <div class="w-10 h-1 bg-zinc-800/80 rounded-full mx-auto"></div>
    </footer>
</div>

<script>
    /* ========================================================
       ÁLLAPOTOK ÉS VIBRÁCIÓ
       ======================================================== */
    let currentInput = "";
    let activeMode = 'free'; // 'free', 'identity', 'extract', 'insert', 'div'
    let tplState = {
        field: 'a', // Aktív beviteli mező sablonnál
        a: '5',
        b: '7',
        sign: '+'
    };

    function haptic(ms = 20) {
        if ("vibrate" in navigator) {
            try { navigator.vibrate(ms); } catch (e) {}
        }
    }

    // Óra
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const elem = document.getElementById('current-time');
        if (elem) elem.textContent = `${hrs}:${mins}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ========================================================
       MÓDVÁLTÁS ÉS SABLONOK INICIALIZÁLÁSA
       ======================================================== */
    function switchMode(mode) {
        haptic(25);
        activeMode = mode;
        const tabs = ['free', 'identity', 'extract', 'insert', 'div'];
        tabs.forEach(t => {
            const el = document.getElementById(`tab-${t}`);
            if (t === mode) {
                el.className = "watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-cyan-600 text-white shadow whitespace-nowrap";
            } else {
                el.className = "watch-btn text-[10px] font-bold px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap";
            }
        });

        const headerTitle = document.getElementById('header-mode-title');
        const viewFree = document.getElementById('view-free');
        const viewTemplate = document.getElementById('view-template');
        const viewResult = document.getElementById('view-result');

        viewResult.classList.add('hidden');

        if (mode === 'free') {
            headerTitle.textContent = "SZABAD BEVITEL";
            viewFree.classList.remove('hidden');
            viewTemplate.classList.add('hidden');
        } else {
            viewFree.classList.add('hidden');
            viewTemplate.classList.remove('hidden');
            setupTemplateCard(mode);
        }
    }

    function setupTemplateCard(mode) {
        const card = document.getElementById('template-card');
        const headerTitle = document.getElementById('header-mode-title');

        if (mode === 'identity') {
            headerTitle.textContent = "(√a ± √b)² AZONOSSÁG";
            tplState = { field: 'a', a: '5', b: '7', sign: '+' };
            renderIdentityTemplate();
        } else if (mode === 'extract') {
            headerTitle.textContent = "GYÖKBŐL KIEMELÉS";
            tplState = { field: 'a', a: '72' };
            renderExtractTemplate();
        } else if (mode === 'insert') {
            headerTitle.textContent = "GYÖK ALÁ VITEL";
            tplState = { field: 'a', a: '3', b: '5' };
            renderInsertTemplate();
        } else if (mode === 'div') {
            headerTitle.textContent = "GYÖKÖS OSZTÁS";
            tplState = { field: 'a', a: '150', b: '6' };
            renderDivTemplate();
        }
    }

    function setTplField(field) {
        haptic(15);
        tplState.field = field;
        if (activeMode === 'identity') renderIdentityTemplate();
        else if (activeMode === 'insert') renderInsertTemplate();
        else if (activeMode === 'div') renderDivTemplate();
    }

    function toggleSign() {
        haptic(20);
        tplState.sign = tplState.sign === '+' ? '-' : '+';
        renderIdentityTemplate();
    }

    function renderIdentityTemplate() {
        const card = document.getElementById('template-card');
        card.innerHTML = `
            <div class="text-[10px] text-zinc-400 font-mono mb-1">(a ± b)² = a² ± 2ab + b²</div>
            <div class="flex items-center gap-1 text-base font-bold mono">
                <span>(√</span>
                <span onclick="setTplField('a')" class="px-2 py-0.5 rounded-lg border ${tplState.field === 'a' ? 'border-cyan-400 bg-cyan-950/70 text-cyan-300' : 'border-zinc-800 bg-zinc-900 text-white'}">${tplState.a || '0'}</span>
                <button onclick="toggleSign()" class="px-1.5 py-0.5 rounded bg-zinc-800 text-emerald-400 font-black">${tplState.sign}</button>
                <span>√</span>
                <span onclick="setTplField('b')" class="px-2 py-0.5 rounded-lg border ${tplState.field === 'b' ? 'border-cyan-400 bg-cyan-950/70 text-cyan-300' : 'border-zinc-800 bg-zinc-900 text-white'}">${tplState.b || '0'}</span>
                <span>)²</span>
            </div>
        `;
    }

    function renderExtractTemplate() {
        const card = document.getElementById('template-card');
        card.innerHTML = `
            <div class="text-[10px] text-zinc-400 font-mono mb-1">Gyök alól kihozás (√x)</div>
            <div class="flex items-center gap-1 text-lg font-bold mono">
                <span>√</span>
                <span class="px-3 py-1 rounded-lg border border-cyan-400 bg-cyan-950/70 text-cyan-300">${tplState.a || '0'}</span>
            </div>
        `;
    }

    function renderInsertTemplate() {
        const card = document.getElementById('template-card');
        card.innerHTML = `
            <div class="text-[10px] text-zinc-400 font-mono mb-1">Gyök alá bevitel: a√b = √(a²·b)</div>
            <div class="flex items-center gap-1 text-base font-bold mono">
                <span onclick="setTplField('a')" class="px-2 py-0.5 rounded-lg border ${tplState.field === 'a' ? 'border-cyan-400 bg-cyan-950/70 text-cyan-300' : 'border-zinc-800 bg-zinc-900 text-white'}">${tplState.a || '0'}</span>
                <span>· √</span>
                <span onclick="setTplField('b')" class="px-2 py-0.5 rounded-lg border ${tplState.field === 'b' ? 'border-cyan-400 bg-cyan-950/70 text-cyan-300' : 'border-zinc-800 bg-zinc-900 text-white'}">${tplState.b || '0'}</span>
            </div>
        `;
    }

    function renderDivTemplate() {
        const card = document.getElementById('template-card');
        card.innerHTML = `
            <div class="text-[10px] text-zinc-400 font-mono mb-1">Gyökös hányados: √a / √b</div>
            <div class="flex items-center gap-1 text-base font-bold mono">
                <span>√</span>
                <span onclick="setTplField('a')" class="px-2 py-0.5 rounded-lg border ${tplState.field === 'a' ? 'border-cyan-400 bg-cyan-950/70 text-cyan-300' : 'border-zinc-800 bg-zinc-900 text-white'}">${tplState.a || '0'}</span>
                <span class="text-emerald-400">÷</span>
                <span>√</span>
                <span onclick="setTplField('b')" class="px-2 py-0.5 rounded-lg border ${tplState.field === 'b' ? 'border-cyan-400 bg-cyan-950/70 text-cyan-300' : 'border-zinc-800 bg-zinc-900 text-white'}">${tplState.b || '0'}</span>
            </div>
        `;
    }

    function tplInput(k) {
        haptic(15);
        const f = tplState.field;
        if (k === 'DEL') {
            tplState[f] = tplState[f].slice(0, -1);
            if (tplState[f] === '') tplState[f] = '0';
        } else {
            if (tplState[f] === '0') tplState[f] = k;
            else if (tplState[f].length < 5) tplState[f] += k;
        }

        if (activeMode === 'identity') renderIdentityTemplate();
        else if (activeMode === 'extract') renderExtractTemplate();
        else if (activeMode === 'insert') renderInsertTemplate();
        else if (activeMode === 'div') renderDivTemplate();
    }

    /* ========================================================
       BILLENTYŰZET BEVITEL (SZABAD MÓD)
       ======================================================== */
    function inputKey(key) {
        haptic(15);
        if (key === 'AC') {
            currentInput = "";
        } else if (key === 'DEL') {
            if (currentInput.length > 0) currentInput = currentInput.slice(0, -1);
        } else {
            currentInput += key;
        }
        updateDisplay();
    }

    function updateDisplay() {
        const display = document.getElementById('math-display');
        const preview = document.getElementById('preview-text');

        if (!currentInput || currentInput.trim() === "") {
            display.innerHTML = '<span class="text-zinc-600">0</span>';
            preview.textContent = "Pl: √2 + √50 - √18 vagy (√5 + √7)²";
        } else {
            display.textContent = currentInput;
            preview.textContent = "Számításra kész";
        }
    }

    /* ========================================================
       MATEMATIKAI MOTOR ÉS ISKOLAI LEVEZETŐ
       ======================================================== */

    // Prímtényezős és négyzetszám felbontás
    function getSquareFactorization(n) {
        if (n <= 0) return { outside: 0, inside: 0, sq: 1, rem: 0 };
        let largestSquare = 1;
        for (let i = Math.floor(Math.sqrt(n)); i >= 2; i--) {
            if (n % (i * i) === 0) {
                largestSquare = i * i;
                break;
            }
        }
        const outside = Math.round(Math.sqrt(largestSquare));
        const inside = n / largestSquare;
        return { outside, inside, sq: largestSquare, rem: inside };
    }

    // Term: coeff * √radicand
    class MathRadical {
        constructor(coeff, rad) {
            this.coeff = coeff;
            this.rad = rad;
        }

        simplifyWithSteps() {
            if (this.rad === 0 || this.coeff === 0) return { term: new MathRadical(0, 0), step: null };
            if (this.rad === 1) return { term: new MathRadical(this.coeff, 0), step: null };

            const f = getSquareFactorization(this.rad);
            if (f.outside > 1) {
                const newCoeff = this.coeff * f.outside;
                const newRad = f.inside === 1 ? 0 : f.inside;
                const step = `√${this.rad} = √(${f.sq} · ${f.rem}) = ${f.outside}${newRad > 0 ? '√' + newRad : ''}`;
                return { term: new MathRadical(newCoeff, newRad), step: step, factor: f };
            }
            return { term: this, step: null, factor: f };
        }

        toString() {
            if (this.coeff === 0) return "0";
            if (this.rad === 0) return `${this.coeff}`;
            let cStr = "";
            if (this.coeff === 1) cStr = "";
            else if (this.coeff === -1) cStr = "-";
            else cStr = `${this.coeff}`;
            return `${cStr}√${this.rad}`;
        }
    }

    // 1. NEVEZETES AZONOSSÁG MEGOLDÁSA: (√a ± √b)²
    function solveIdentity(a, b, sign) {
        const steps = [];
        const isPlus = sign === '+';

        steps.push({
            title: "Alkalmazott nevezetes azonosság",
            math: `(a ${sign} b)² = a² ${isPlus ? '+' : '-'} 2ab + b²`
        });

        steps.push({
            title: "1. Behelyettesítés a képletbe",
            math: `(√${a} ${sign} √${b})² = (√${a})² ${isPlus ? '+' : '-'} 2·√${a}·√${b} + (√${b})²`
        });

        const prod = a * b;
        steps.push({
            title: "2. Gyökvonás és szorzás a gyök alatt",
            math: `(√${a})² = ${a},  (√${b})² = ${b},  √${a}·√${b} = √(${a}·${b}) = √${prod}`
        });

        // Nézzük meg, hogy a prod kihozható-e a gyök alól
        const f = getSquareFactorization(prod);
        let middleCoeff = 2;
        let middleRad = prod;
        let middleText = `2√${prod}`;

        if (f.outside > 1) {
            middleCoeff = 2 * f.outside;
            middleRad = f.inside === 1 ? 0 : f.inside;
            middleText = `${middleCoeff}${middleRad > 0 ? '√' + middleRad : ''}`;
            steps.push({
                title: "3. Középső tag egyszerűsítése (kiemelés)",
                math: `2√${prod} = 2 · √(${f.sq} · ${f.rem}) = 2 · ${f.outside}√${f.rem} = ${middleText}`
            });
        }

        const sumRational = a + b;
        steps.push({
            title: "4. Racionális számok összeadása",
            math: `${a} + ${b} = ${sumRational}`
        });

        let finalExact = "";
        let approxVal = 0;
        if (middleRad === 0) {
            const finalNum = isPlus ? (sumRational + middleCoeff) : (sumRational - middleCoeff);
            finalExact = `${finalNum}`;
            approxVal = finalNum;
        } else {
            finalExact = `${sumRational} ${isPlus ? '+' : '-'} ${middleCoeff === 1 ? '' : middleCoeff}√${middleRad}`;
            approxVal = isPlus ? (sumRational + middleCoeff * Math.sqrt(middleRad)) : (sumRational - middleCoeff * Math.sqrt(middleRad));
        }

        return {
            exact: finalExact,
            approx: `≈ ${approxVal.toFixed(4)}`,
            steps: steps
        };
    }

    // 2. GYÖK ALÓL KIHOZÁS: √n
    function solveExtraction(n) {
        const steps = [];
        steps.push({
            title: "Cél",
            math: `A legnagyobb négyzetszám szorzótényező kiemelése √${n}-ből`
        });

        const f = getSquareFactorization(n);
        if (f.outside > 1) {
            steps.push({
                title: "1. Szorzattá bontás négyzetszámmal",
                math: `${n} = ${f.sq} · ${f.rem}`
            });
            steps.push({
                title: "2. Négyzetgyökvonás tényezőnként",
                math: `√${n} = √(${f.sq} · ${f.rem}) = √${f.sq} · √${f.rem} = ${f.outside}√${f.rem}`
            });

            return {
                exact: f.rem === 1 ? `${f.outside}` : `${f.outside}√${f.rem}`,
                approx: `≈ ${(Math.sqrt(n)).toFixed(4)}`,
                steps: steps
            };
        } else {
            steps.push({
                title: "Vizsgálat",
                math: `A ${n} nem osztható 1-nél nagyobb négyzetszámmal (4, 9, 16, 25...), így nem hozható ki belőle tényező.`
            });
            return {
                exact: `√${n}`,
                approx: `≈ ${(Math.sqrt(n)).toFixed(4)}`,
                steps: steps
            };
        }
    }

    // 3. GYÖK ALÁ BEVITEL: a√b
    function solveInsertion(a, b) {
        const steps = [];
        const aSq = a * a;
        const total = aSq * b;

        steps.push({
            title: "Alkalmazott szabály",
            math: `a√b = √(a² · b)`
        });
        steps.push({
            title: "1. Együttható négyzetre emelése",
            math: `${a}² = ${aSq}`
        });
        steps.push({
            title: "2. Bevitele a gyök alá és összeszorzás",
            math: `√(${aSq} · ${b}) = √${total}`
        });

        return {
            exact: `√${total}`,
            approx: `≈ ${(a * Math.sqrt(b)).toFixed(4)}`,
            steps: steps
        };
    }

    // 4. GYÖKÖS OSZTÁS: √a / √b
    function solveDivision(a, b) {
        const steps = [];
        steps.push({
            title: "Alkalmazott szabály",
            math: `√a / √b = √(a / b)`
        });

        if (a % b === 0) {
            const quotient = a / b;
            steps.push({
                title: "1. Közös gyök alá vitel és osztás",
                math: `√${a} / √${b} = √(${a} / ${b}) = √${quotient}`
            });

            const extractSol = solveExtraction(quotient);
            extractSol.steps.forEach(s => steps.push(s));

            return {
                exact: extractSol.exact,
                approx: extractSol.approx,
                steps: steps
            };
        } else {
            // Gyöktelenítés / Egyszerűsítés
            const gcd = (x, y) => (!y ? x : gcd(y, x % y));
            const div = gcd(a, b);
            const simA = a / div;
            const simB = b / div;

            steps.push({
                title: "1. Tört egyszerűsítése a gyök alatt",
                math: `√(${a} / ${b}) = √(${simA} / ${simB})`
            });
            steps.push({
                title: "2. Nevező gyöktelenítése",
                math: `(√${simA} · √${simB}) / ${simB} = √(${simA * simB}) / ${simB}`
            });

            const topExt = solveExtraction(simA * simB);
            return {
                exact: `(${topExt.exact}) / ${simB}`,
                approx: `≈ ${(Math.sqrt(a) / Math.sqrt(b)).toFixed(4)}`,
                steps: steps
            };
        }
    }

    // 5. SZABAD KIFEJEZÉS ELEMZŐJE (pl. √2 + √50 - √18 VAGY (√5 + √7)²)
    function solveArbitrary(input) {
        let str = input.replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/');

        // Ellenőrizzük, hogy nevezetes azonosság alakú-e: (√5+√7)² vagy (√13-√11)²
        const idMatch = str.match(/^\(√(\d+)([+-])√(\d+)\)(²|\^2)$/);
        if (idMatch) {
            const a = parseInt(idMatch[1]);
            const sign = idMatch[2];
            const b = parseInt(idMatch[3]);
            return solveIdentity(a, b, sign);
        }

        // Ellenőrizzük a gyökös osztást: √150/√6
        const divMatch = str.match(/^√(\d+)\/(\d+|√\d+)$/);
        if (divMatch) {
            const a = parseInt(divMatch[1]);
            const b = parseInt(divMatch[2].replace('√', ''));
            return solveDivision(a, b);
        }

        // Füzet 1. feladata: Gyökök összeadása/kivonása és kiemelése (pl. √2 + √50 - √18)
        const steps = [];
        steps.push({
            title: "Kezdeti kifejezés",
            math: input
        });

        // Tagokra bontás
        const termRegex = /([+-]?[^+-]+)/g;
        const rawTerms = str.match(termRegex);
        if (!rawTerms) throw new Error("Érvénytelen kifejezés");

        const parsedRadicals = [];
        const intermediateStepParts = [];

        rawTerms.forEach(t => {
            let sign = 1;
            let item = t;
            if (item.startsWith('+')) item = item.substring(1);
            else if (item.startsWith('-')) {
                sign = -1;
                item = item.substring(1);
            }

            let coeff = 1;
            let rad = 0;

            if (item.includes('√')) {
                const parts = item.split('√');
                if (parts[0] !== "") coeff = parseInt(parts[0]);
                rad = parseInt(parts[1]);
            } else {
                coeff = parseInt(item);
                rad = 0;
            }

            coeff = coeff * sign;
            const obj = new MathRadical(coeff, rad);
            parsedRadicals.push(obj);

            // Részletes kiemelés leírás
            if (rad > 0) {
                const f = getSquareFactorization(rad);
                if (f.outside > 1) {
                    const cText = obj.coeff < 0 ? `-` : (intermediateStepParts.length > 0 ? `+` : ``);
                    intermediateStepParts.push(`${cText} √(${f.sq}·${f.rem})`);
                } else {
                    intermediateStepParts.push((obj.coeff < 0 ? `-` : (intermediateStepParts.length > 0 ? `+` : ``)) + obj.toString().replace('+', ''));
                }
            } else {
                intermediateStepParts.push((obj.coeff < 0 ? `-` : (intermediateStepParts.length > 0 ? `+` : ``)) + obj.coeff);
            }
        });

        steps.push({
            title: "1. Tagok felbontása négyzetszám szorzattá (mint a füzetben)",
            math: intermediateStepParts.join(' ').replace(/\+\s*\-/g, '- ')
        });

        // Kiemelés a gyök alól elemenként
        const simplifiedTerms = [];
        const afterExtractionParts = [];

        parsedRadicals.forEach(term => {
            const res = term.simplifyWithSteps();
            simplifiedTerms.push(res.term);
            const strT = res.term.toString();
            if (simplifiedTerms.length > 1 && !strT.startsWith('-')) {
                afterExtractionParts.push(`+ ${strT}`);
            } else {
                afterExtractionParts.push(strT);
            }
        });

        steps.push({
            title: "2. Gyökök kiemelése (részeredmények)",
            math: afterExtractionParts.join(' ')
        });

        // Azonos gyökök összevonása
        const groups = {};
        simplifiedTerms.forEach(t => {
            if (!groups[t.rad]) groups[t.rad] = 0;
            groups[t.rad] += t.coeff;
        });

        const finalTerms = [];
        let approxTotal = 0;

        for (let radKey in groups) {
            const c = groups[radKey];
            const r = parseInt(radKey);
            if (c !== 0) {
                const term = new MathRadical(c, r);
                finalTerms.push(term);
                approxTotal += (r === 0 ? c : c * Math.sqrt(r));
            }
        }

        steps.push({
            title: "3. Egynemű gyökök összevonása",
            math: "Azonos gyökjel alatti számok együtthatóinak összeadása"
        });

        let finalString = "";
        if (finalTerms.length === 0) {
            finalString = "0";
        } else {
            finalString = finalTerms.map((t, idx) => {
                const s = t.toString();
                if (idx > 0 && !s.startsWith('-')) return `+ ${s}`;
                return s;
            }).join(' ');
        }

        return {
            exact: finalString,
            approx: `≈ ${approxTotal.toFixed(4)}`,
            steps: steps
        };
    }

    /* ========================================================
       VEZÉRLÉS: SZÁMÍTÁSOK INDÍTÁSA
       ======================================================== */
    function computeFreeExpression() {
        if (!currentInput || currentInput.trim() === "") return;
        try {
            const sol = solveArbitrary(currentInput);
            displaySolution(sol);
        } catch (e) {
            alert("Kérlek ellenőrizd a kifejezést! Pl: √2 + √50 - √18 vagy (√5 + √7)²");
        }
    }

    function computeTemplate() {
        try {
            let sol = null;
            if (activeMode === 'identity') {
                const a = parseInt(tplState.a || '0');
                const b = parseInt(tplState.b || '0');
                sol = solveIdentity(a, b, tplState.sign);
            } else if (activeMode === 'extract') {
                const a = parseInt(tplState.a || '0');
                sol = solveExtraction(a);
            } else if (activeMode === 'insert') {
                const a = parseInt(tplState.a || '0');
                const b = parseInt(tplState.b || '0');
                sol = solveInsertion(a, b);
            } else if (activeMode === 'div') {
                const a = parseInt(tplState.a || '0');
                const b = parseInt(tplState.b || '0');
                sol = solveDivision(a, b);
            }
            if (sol) displaySolution(sol);
        } catch (e) {
            alert("Hiba történt a számítás során.");
        }
    }

    function displaySolution(sol) {
        haptic(40);
        document.getElementById('res-exact').textContent = sol.exact;
        document.getElementById('res-approx').textContent = sol.approx;

        const container = document.getElementById('res-steps');
        container.innerHTML = "";

        sol.steps.forEach((st, idx) => {
            const card = document.createElement('div');
            card.className = "bg-zinc-950 border border-zinc-800 rounded-xl p-2";
            card.innerHTML = `
                <div class="text-[9px] font-bold text-cyan-400 mb-0.5 uppercase">${st.title}</div>
                <div class="text-[11px] text-zinc-100 mono break-words">${st.math || st.desc}</div>
            `;
            container.appendChild(card);
        });

        // Nézet megjelenítése
        document.getElementById('view-free').classList.add('hidden');
        document.getElementById('view-template').classList.add('hidden');
        document.getElementById('view-result').classList.remove('hidden');
    }

    function closeResult() {
        haptic(20);
        document.getElementById('view-result').classList.add('hidden');
        if (activeMode === 'free') {
            document.getElementById('view-free').classList.remove('hidden');
        } else {
            document.getElementById('view-template').classList.remove('hidden');
        }
    }

    // Kezdeti állapot
    updateDisplay();
</script>
